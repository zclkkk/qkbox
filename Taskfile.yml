version: '3'

tasks:
  check:
    summary: Runs the local verification suite
    cmds:
      - npm run check

  test:
    summary: Runs Go tests
    cmds:
      - npm run test

  build:
    summary: Builds qkboxd, qkbox-provider, and the Wails desktop app
    cmds:
      - npm run build

  package:windows:nsis:
    summary: Builds the Windows NSIS installer from existing binaries
    deps:
      - task: build
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File packaging/windows/build-nsis.ps1

  package:linux:deb:
    summary: Builds the Linux DEB package from existing Linux binaries
    deps:
      - task: build
    cmds:
      - bash packaging/linux/build-deb.sh

  build:qkboxd:
    summary: Builds the user-scope qkboxd executable
    cmds:
      - go build -tags with_clash_api -trimpath -buildvcs=false -o "bin/qkboxd{{exeExt}}" ./cmd/qkboxd

  build:qkbox-provider:
    summary: Builds the privileged provider executable
    cmds:
      - go build -tags with_clash_api -trimpath -buildvcs=false -o "bin/qkbox-provider{{exeExt}}" ./cmd/qkbox-provider

  desktop:dev:
    summary: Runs the desktop app in Wails dev mode
    cmds:
      - wails3 task -dir apps/desktop dev
